services:
  postgres:
    image: postgres:16-alpine
    container_name: leadsdom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadsdom
      POSTGRES_PASSWORD: leadsdom
      POSTGRES_DB: leadsdom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadsdom -d leadsdom"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: leadsdom-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
